        // 저장하세요.
        // 이후 색상을 "검정색"으로 바꾸고, 가격을 3000으로 수정한 뒤 console.log()로 출력하세요.
        let car ={

        // 그 후 배열 cart에 넣고, 장바구니 총 금액을 console.log()로 구하세요. 

        let item1 = {name:'노트북',price:1000,quantity:1};

        // 식별자는 기본 id:0, id:1...... , 데이터베이스의 기본키와 같은 역활을 한다.
        let cart02 =[

        ];

        // car는 배열 => for
        let sum = 0;
        for(let i=0; i<cart.length; i++){
            sum += cart[i].price * cart[i].quantity;
        }
