<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal 만들기</title>
    <link rel="stylesheet" href="/style/ex_Modal.css">
    <!-- <head>안에 외부 자바스크립트 파일 연결하기
         단, 반드시 defer 명령어 입력한다.
         defe을 입력하면 HTML 해석이 완전히 다 끝나고, 난 후 자바스크립트 실행
    -->
    <script src="/js/ex_modal.js" defer></script>     

</head>
<body>
    <!-- 모달 열기 버튼 -->
     <button class="btn-open">뉴스레터 구독하기</button>
     <!-- 모달 전체  -->
     <div class="modal">
        <!-- 이미지, 텍스트 콘텐츠 영역 -->
         <div class="modal-content">
            <!-- 왼쪽 이미지 -->
             <div class="photo"></div>
             <!-- 오른쪽 설명 -->
             <div class="desc">
                <div class="desc-header">
                    <h2>지금 다양한 혜택을 받아보세요</h2>
                    <button class="btn-close">&times;</button>
                </div>
                <div class="desc-content">
                    <input type="email" placeholder="이메일 주소를 입력하시오">
                    <button>뉴스레터 구독하기</button>
                    <p>
                      스타트업메이트 뉴스룸의 다양한 소식과 혜택을 이메일로 받아
                      보시려면 구독 신청 해주시기 바랍니다. 스타트업메이트에 대해 알고
                      싶은 뉴스, 꼭 알아야 할 뉴스를 신속하고 정확하게 전합니다.
                    </p>
                </div>
             </div>
          </div>
       </div> 
       <!-- 오버레이 -->
       <div class="overlay"></div>

       <!-- <script>
        // DOM요소 접근
        let btnOpen = document.querySelector('.btn-open');
        let btnClose = document.querySelector('.btn-close');
        let modal = document.querySelector('.modal');
        let overlay = document.querySelector('.overlay');

        // addEventListener()이용
        // 모달 열기
        btnOpen.addEventListener('click',() => {
            modal.classList.add('active');
            overlay.classList.add('active');
        });
        // 모달 닫기
        btnClose.addEventListener('click',() => {
            modal.classList.remove('active');
            overlay.classList.remove('active');
        });
        // 오버레이 클릭시 모달 닫기
        overlay.addEventListener('click',() => {
            modal.classList.remove('active');
            overlay.classList.remove('active');
        });
       </script> -->
</body>
</html>
