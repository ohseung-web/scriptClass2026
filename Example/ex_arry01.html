<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 연습 기초문제</title>
</head>
<body>
    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>
    <p id="p4"></p>
    <p id="p5"></p>

    <script>
        let p1 = document.getElementById('p1');
        let p2 = document.getElementById('p2');
        let p3 = document.getElementById('p3');
        let p4 = document.getElementById('p4');
        let p5 = document.getElementById('p5');
        
        // 문제1) p1태그에 1번 인덱스 값 출력
        let numbers = [10,20,30,40,50,60];
        p1.innerText = `1번 요소 : ${numbers[1]}`;
        
        // 문제2) p2태그에 slice를 이용하여 green과 blue의 값만 출력
        let colors =['red','green','blue','yellow'];
        p2.innerText = `slice(1,3) 요소 : ${colors.slice(1,3)}`;
        
        // 문제3) p3태그에  for문을 이용하여 names의 전체 요소 출력
        let names =['Jason','Alice','Candy'];
        let result = '' ; // 문자열 담을 변수
        for(let i=0; i<names.length; i++){
            result += names[i] + ' ';
        }
        p3.innerText = `result 요소 : ${result}`;

        // 문제4) p4태그에 1~10까지 배열생성후, 짝수만 출력 
        let nums = []; // 빈배열
        console.log('4번:'+nums.length); // 0
        let result01 = '';
        for(let i=1; i<=10; i++){
            nums.push(i);
            // console.log(nums);
            if(nums[i-1] % 2 == 0){
                result01 += nums[i-1] + " ";
            }
        }
        p4.innerText = `짝수 : ${result01}`;

        let arr = new Array(10); //빈배열
        for(let i=0; i<arr.length; i++){
            arr[i] = (i+1);
            // console.log(nums);
            if(arr[i] % 2 == 0){
                result01 += arr[i] + " ";
            }
        }
        p4.innerText = `짝수 : ${result01}`;

        // 문제5) p5태그에 score가 80이상이면 '합격', 아니면 '불합격'출력
        let scores = [90,75,60,100,88];
        let result02 ='';
        for(let i=0; i<scores.length; i++){
            if(scores[i] >= 80){
                result02 += '합격'+ ' ';
            }else{
                result02 += '불합격'+ ' ';
            }
        }
        p5.innerText = `5번 : ${result02}`; 

    </script>


</body>
</html>
