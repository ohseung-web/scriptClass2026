<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코어 기초 연습 문제</title>
</head>
<body>
    <button onclick="showYear()">1. 현재년도출력</button>
    <button onclick="showDay()">2. 오늘 요일 출력</button>
    <button onclick="showTime()">3. 현재 시간 출력</button>
    <button onclick="showDates()">4. 하루 후, 일주일 후 날짜 출력</button>
    <button onclick="showWeekend()">5. 요일에 따른 메시지 출력</button>
    <p id="output"></p>

    <script>
        // 1. 현재 연도 출력
        // 문제: 현재 날짜를 Date 객체로 가져와서 콘솔에 "올해는 2026년입니다." 
        // 형식으로 출력하세요.

        // 2. 오늘 요일 출력
        // 문제: 현재 날짜를 이용하여 오늘 요일을 한글로 출력하세요.
        // 예: "오늘은 화요일입니다."

        // 3. 3. 현재 시간 출력
        // 문제: 현재 시간을 시:분:초 형식으로 출력하세요.
        // 예: "현재 시간: 14:35:20"

        // 4. 하루 후, 일주일 후 날짜 출력
        // 문제: 오늘 날짜를 기준으로 하루 후와 일주일 후 날짜를 출력하세요.

        let ouptput = document.getElementById('output');
        function showDates(){
            let today = new Date();

            // 내일
            let tomorrow = new Date(today); // 원본날짜 복사해서 사용
            tomorrow.setDate(today.getDate() + 1);

            // 일주일 후
            let nextWeek = new Date(today);
            nextWeek.setDate(today.getDate()+7);

            ouptput.innerHTML = `하루 후 : ${tomorrow.toLocaleDateString()}<br/>
                                 일주일 후 : ${nextWeek.toLocaleDateString()}`;

        }

        // 5. 요일에 따라 메시지 출력
        // 문제: 오늘 요일이 주말(토, 일)이면 "주말이에요!", 
        // 평일이면 "열심히 일하는 날!"을 출력하세요
  


    </script>
</body>
</html>
