<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실무 배열 연습문제</title>
    <style>
        .fail{
            color:red;
        }
    </style>
</head>
<body>
    <h2>학생 성적표</h2>
    <button onclick="showGrade()">성적표 출력</button>
    <div id="output"></div>
    <script>
        // innerText => <p id='p1'>값이 문자가 저장</p>
        // innerText => <p id='p1'><span></span></p>, 
        // 이런 경우 span태그가 아니라 그냥 span이란 문자에 불과하다.
        // innerHTML => <div id='output'><span class='a'>~~</span></div>
        // 이런 경우 span은 태그가 된고 class='a'라는 클래스 이름도 가질 수 있다.

        let output = document.getElementById('output');
        function showGrade(){
            // 학생이름과 점수를 배열로 생성한다.
            let students = ['철수','영희','민수','수지','준호'];
            let scores =[85,56,92,77,60];
            let result = '';

            for(let i=0; i<students.length; i++){
                let status = scores[i]>=60?'합격':'불합격';
                // 클래스 이름 지정하는 코드
                let className = scores[i]>=60?'pass':'fail';
                // `` 백틱 사용해서 result에 태그 작성
                result += `${students[i]}:${scores[i]}점 - <span class='${className}'>${status}</span></br> `;
            }
            output.innerHTML = result;
        }

    </script>
</body>
</html>
