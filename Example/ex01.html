<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연습문제 기초</title>
</head>
<body>
    <!-- problem1() 스크립트에서 작성할 함수 이름이다. 
         버튼을 클릭하는 사건이 일어나면 problem1()함수를 호출하여
         실행하라 라는 의미이다.
         단, 함수는 스크립트영역에만 작성할 수 있다. 
    -->
    <button onclick="problem1()">문제1: 변수와 상수 출력</button>
    <p id="p1"></p>
    <hr/>
    <button onclick="problem2()">문제 2: 두 수 더하기</button>
    <p id="p2"></p>

    <hr/>
    <input id="numInput" type="number" placeholder="숫자 입력" />
    <button onclick="showVariable()">값 확인</button>
    <p id="output1"></p>

    <hr/>
    <!-- num1과 num2의 값을 입력하고 두 값을 비교하여
         n1>n2 ? false, n1=n2?false, n1<n2?true
         삼항연산자로 함수를 작성하기 
    -->
    <input id="num1" type="number" placeholder="숫자1" />
    <input id="num2" type="number" placeholder="숫자2" />
    <button onclick="compareNum()">비교</button>
    <p id="output5"></p>

    <hr/>
    <input id="score" type="number" placeholder="점수 입력" />
    <button onclick="checkGrade()">등급 확인</button>
    <p id="output8"></p>

    
    <script>
        let score = document.getElementById('score');
        // let output8=document.getElementById('output8');

        let num01 = document.getElementById('num1');
        let num02 = document.getElementById('num2');
        let output5 = document.getElementById('output5');

        let print01= document.getElementById('p1');
        let print02= document.getElementById('p2');
        // input에서 입력한 값을 출력하려면 value메소드 이용한다.
        //  let value01= document.getElementById('numInput').value;=>이런경우
        //  자바스크립트는 코드 실행 순서가 존재하는데 , 스크립트 파일이 로드될 때 함수바깥쪽
        //  코드를 먼저 실행한다.
        // let value01= document.getElementById('numInput');
        let print03= document.getElementById('output1');

        function problem1(){
            let name='홍길동';
            let age = 20;
            // DOM을 이용한다. 자바스크립트가 태그에 접근하도록
            // 작성하는 방법이다.
            // p1이라는 id를 가진 요소(태그)안쪽 문자로 
            // 이름:홍길동, 나이:20으로 저장하여 주세요
            // document.getElementById('p1').innerText='이름 :'+name+', 나이:'+age;
            // document.getElementById('p1').innerText=`이름:${name}, 나이:${age}`;
            print01.innerText=`이름:${name}, 나이:${age}`;
        }

        function problem2(){
            let num1 = 10;
            let num2 = 20;
            let sum = num1 + num2;
            console.log(sum);
            // print02.innerText=`합계: ${sum}`;
        }
        function showVariable(){
            // input태그를 이용해 입력받은 모든값은 '15'문자이다.
            // 형변환을 한다. => 스크립트는 숫자로 형변환하는 함수로 Number()사용한다.
            // let num = Number(value01.value);
            let num = Number(document.getElementById('numInput').value);
            console.log(num); // <p id="output1"></p>
            print03.innerText = `변수 num의 값 : ${num + 'a'}`;
        }
        function compareNum(){
            let n1= Number(num01.value);
            let n2= Number(num02.value);
            output5.innerText = n2>n1?'true':'false';
        }
        function checkGrade(){
            // 삼항연산자 이용, 90이상 A, 80이상 B, 70이상 C, 60이상 D, 그외 F
            let score01 = Number(score.value);
            let grade = score01>=90?'A':score01>=80?'B':score01>=70?'C':score01>=60?'D':'F';
            output8.innerText=grade;

        }
    </script>
</body>
</html>
