<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList 연습문제</title>
    <style>
        .todo-container{
            width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="todo-container">
        <h1>할 일 목록</h1>
        <div class="input-area">
            <input id="task" type="text" placeholder="할 일 입력">
            <button onclick="addTask()">추가</button>
        </div>
        <ul id="tasks"></ul>
    </div>

    <script>
      function  addTask(){
        // 부모 ul태그 접근
        let tasks = document.getElementById('tasks');
        // input태그에 접근
        let inputVal = document.getElementById('task').value;
        // li를 생성한다 => createElemnet

        // input에 빈값이 입력되지 못하도록 예외처리 함
        if(inputVal === '')return;

        let liList = document.createElement('li');
        // 생성한 li안에 입력할 텍스트는 input에서 입력받은 값이어야 한다.
        liList.innerText = inputVal;
        // ul의 부모에 자식으로 추가
        tasks.appendChild(liList);

        // li안에 button 생성하기
        let btn = document.createElement('button');
        liList.appendChild(btn);
        // 생성한 button에 class이름을 생성하는 프로퍼티 : className
        btn.className ='delbtn';
        btn.innerText='X';

        // btn을 클릭하면 삭제
        // 이름이 없는 함수를 익명함수라 칭한다.
        btn.onclick = function(){
            liList.remove();
        }

  
      }
    </script>

</body>
</html>
