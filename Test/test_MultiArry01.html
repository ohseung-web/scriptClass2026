<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차원 배열 </title>
</head>
<body>
    <script>
        // 2차원 배열 생성하는 방법 3가지 설명
        // 자바스크립트에서 2차원 배열은 기본적으로 존재하지 않는다.
        // 다만, 2차원 배열처럼 생성할 수 있는 여러가지 방법이 존재한다.
        // 1. 초기값을 할당하여 배열 생성하는 방법
        // 아래 arr 배열은 3행 2열의 배열을 선언과 동시에 초기화 하였다.
        let arr=[
            ['a','b'], //1행
            ['c','d'], //2행
            ['e','f']  //3행
        ];
        // for문을 이용하여 콘솔에 출력한다.
        // 단, 다중 for문을 사용한다.
        for(let i=0; i<arr.length; i++){ // 행의 루프 돌리기
            // 열의 루프 돌리기
            for(let j=0; j<arr[i].length; j++){
                console.log(`arr의 출력 : ${arr[i][j]}`)
            }
        }


        // 2. new Array(행)을 이용하여 배열을 생성하는 방법
        let arry02 = new Array(2); // 행
        //열은 for문 이용
        for(let i=0; i<arry02.length; i++){
            arry02[i] = new Array(3); // 열
            // 5이라는 값을 저장함
            for(let j=0; j<arry02[i].length; j++){
                arry02[i][j] = 5;
            }
        }

        // 출력
        for(let i=0; i<arry02.length; i++){
            for(let j=0; j<arry02[i].length; j++){
                console.log(`${[i]},${[j]} : ${arry02[i][j]}`);
            }
        }

        // 3. ES6(자바스크립트 6버전의미)을 지원하는 모든 브라우저라면 사용가능한 방법
        // Array.from(Array(2), () => new Array(3));
        // 6행의 7열의 빈 배열 생성
        const arry03 = Array.from(Array(6),() => new Array(7).fill(0));
        // console.log(`arry03출력 : ${arry03}`);

        // 출력
        arry03.forEach((value,index,arr) => {
            console.log(`arry03 출력 : ${arr}`);
        })

        for(let i=0; i<arry03.length; i++){
            for(let j=0; j<arry03[i].length; j++){
                console.log(`arry03의 ${[i]},${[j]} : ${arry03[i][j]}`);
            }
        }



        // forEach() : 배열 순회 전용 메소드로, 배열일때만 사용가능
        // forEach(value, index, arr) => value:값, index:인덱스번호, arr:배열 전체 값
        //                            => 순서가 중요함
        // 배열이름.forEach( (value, index, arr) => {.....}) 
        // => () => {.....} 콜백 함수라 부른다.
        // call: 함수를 실행(호출)하라
        // back: 나중에, 또는 제어권을 넘겨 받은
       //  직접 함수()형태로 실행되는게 아니라, 제어권을 넘겨받은 다른 함수가
       //  나중에 호출되도록 만드는 것

       const tarry = [10,20,30];
       tarry.forEach((value,index,arr) => {
        // tarry[i]
         console.log(`tarry의 value:${value}`); //10,20,30
         console.log(`tarry의 index:${index}`); // 0,1,2
         console.log(`tarry의 arr:${arr}`); // arr:10,20,30

       });

       // map() : 배열 순회하여 출력하는 메소드 
       //         단, 새로운 배열로 반환된다.
       //             반드시 return 값 이용하여 값을 반환하여야 한다.
       // map()도 콜백함수 형식이다.
   
       let tarry02 =[1,2,3];
       let doubled = tarry02.map((value,index,arr) => {
           console.log(`tarry02 출력 : ${value}`);
           return value * 10;
       })

       // doubled=[10,20,30];
       console.log(`tarry02의 반환된 value : ${doubled}`);


    </script>
</body>
</html>
