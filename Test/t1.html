<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Ex_TotalPrice</title>
  <style>
    .card {
      width: 320px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      font-family: sans-serif;
    }
    .price-info {
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    input[type="number"] {
      width: 60px;
      padding: 5px;
      text-align: center;
    }
    button {
      padding: 6px 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      /* 줄바꿈 문자를 화면에 그대로 반영하기 위한 설정 */
      white-space: pre-line; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>상품 주문하기</h3>
    <p class="price-info">상품 단가: 15,000원</p>
    
    <label for="quantity">수량: </label>
    <input type="number" id="quantity" value="1" min="1">
    <button onclick="calcPrice()">금액 계산</button>

    <div id="result">수량을 입력하고 계산 버튼을 누르세요.</div>
  </div>

  <script>
    function calcPrice() {
      // 1. 단가 및 입력된 수량 가져오기 (데이터 타입 변환)
      const unitPrice = 15000;
      const count = Number(document.getElementById('quantity').value);
      const resultDiv = document.getElementById('result');

      // 2. 조건문(if)을 통한 예외 처리
      if (count <= 0) {
        alert("수량을 1개 이상 입력해주세요.");
        return;
      }

      // 금액 계산
      const totalPrice = unitPrice * count;

      // 3. 조건문(if ~ else)을 통한 결과 메시지 구분 (innerText 활용)
      if (totalPrice >= 50000) {
        resultDiv.innerText = "총 결제 금액: " + totalPrice.toLocaleString() + "원\n 무료배송 대상이며, 사은품이 함께 증정됩니다!";
      } else {
        resultDiv.innerText = "총 결제 금액: " + totalPrice.toLocaleString() + "원\n(5만원 미만 구매 시 배송비 3,000원이 추가됩니다.)";
      }
    }
  </script>

</body>
</html>
