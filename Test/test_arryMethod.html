<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 Method</title>
</head>
<body>
    <script>
        // 자바스크립트의 Array(배열)의 각종 Method
        let ranking=['Jason','Alice','Candy','Chris','Tom'];
        let arrTotal=['korea',90,'2026-09-28'];

        // 1. pop() : 맨 마지막 요소 삭제하고 반환한다.
        console.log(`pop()하기 전 ranking 요소 : ${ranking}`);
        let poped = ranking.pop();
        console.log(`pop()한 요소 : ${poped}`);
        console.log(`pop()한 후 ranking 요소 : ${ranking}`);
        
        
        // 2. push(new data) : 맨 마지막에 새로운 데이터 추가
        ranking.push('David');
        console.log(`push()한 후 ranking 요소 : ${ranking}`);
        
        // 3, shift() : 맨 앞 요소를 삭제하고 반환한다.
        console.log(`shift()하기 전 ranking 요소 : ${ranking}`);
        let shifted = ranking.shift();
        console.log(`shift()한 ranking 요소 : ${shifted}`);
        console.log(`shift()한 후 ranking 요소 : ${ranking}`);
        
        // 4. unshift(new data) : 맨 앞의 새로운 데이터 추가
        ranking.unshift('Emma');
        console.log(`unshift()한 후 ranking 요소 : ${ranking}`);
        
        // 새로운 테스트를 위해 재할당한다.
        ranking=['Jason','Alice','Candy','Chris','Tom'];
        let number =[5,1,8,3,10];
        // 5. join(연결할 문자) : 요소와 요소사이를 연결할 문자로 연결하여 문자열로 반환
        let joinString = ranking.join('-');
        console.log(`join('-')한 후 ranking 요소 : ${joinString}`);
        // Jason-Alice-Candy-Chris-Tom 출력됨
        
        // 6. reverse() : 배열의 요소를 반대로 
        ranking.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${ranking}`);
        arrTotal.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${arrTotal}`);

        // 7. sort() : 기본 오름차순 정렬됨
        ranking.sort();
        console.log(`ranking 요소를 sort() 한 후 : ${ranking}`);
        arrTotal.sort();
        console.log(`arrTotal 요소를 sort() 한 후 : ${arrTotal}`);
        
        // 내림차순 :  sort((a,b) => b-a );
        //            단, 배열의 요소가 숫자일때만 사용 가능
        number.sort((a, b) => b - a );
        // ranking.sort((a, b) => b - a );
        console.log(`number 요소를 sort((a,b)=>a-b) 한 후 : ${number}`);
        

        // 8. slice(시작 인덱스번호, 끝 인덱스번호):
        //    지정한 시작 인덱스번호 ~ 끝 인덱스 번호까지의 구간을 잘라서
        //    새 배열로 생성한다.
        //    slice(1, 3) : 인덱스 1 부터 ~ 인덱스 2까지만 정의 된다.
        let sliceed = ranking.slice(1,3);
        console.log(`rankig slice(1,3)의 한 후 : ${sliceed}`);
        console.log(`rankig slice(1,3)의 한 후 : ${ranking}`);
        
        // 9. splice(시작인, 삭제할 개수, 아이템) : 특정 위치에 데이터 추가
        // 시작인 : 2, 삭제할 개수 : 1, 아이템 : p 
        //         => 2위치에서 1개 삭제하고 p를 추가
        let spliceed = ranking.splice(2,2,'pter');
        console.log(`rankig splice(2,1,'pter')의 한 후 : ${spliceed}`);
        console.log(`rankig splice()의 한 후 : ${ranking}`);
        // 10. concat() : 두 배열을 하나의 합쳐 새 배열 반환한다.
        let newRanking = ranking.concat('Sam','John');
        console.log(`rankig concat() : ${newRanking}`);
        console.log(`rankig concat()한 후 : ${ranking}`);

        // 11. indexOf() : 특정 요소의 인덱스 위치를 반환 , 단, 없으면 -1 반환
        ranking=['Jason','Alice','Candy','Chris','Tom'];
        let index = ranking.indexOf('Alice');
        let index02 = ranking.indexOf('TomCare');
        console.log(`Alice의 인덱스 번호 : ${index}`);
        console.log(`TomCare의 인덱스 번호 : ${index02}`);

        // 12. includes() : 특정한 값이 존재하면 true, 존재하지 않으면 false
        let hasTom = ranking.includes('Tom');
        let hasJake = ranking.includes('Jake');
        console.log(`hasTom 존재유무 : ${hasTom}`); //true
        console.log(`hasJake 존재유무 : ${hasJake}`); //false

        // 13. split('구분자') : 나열된 하나의 문자열을 지정한 구분자를 기준으로 
        //                      쪼개서 배열로 생성하는 메소드이다.
        let test = '사과,포도,딸기';
        let result03 = test.split(',');
        console.log(`test 결과 : ${result03}`);

    </script>
</body>
</html>
