<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 : for</title>
</head>
<body>
    <h4>문제1 : 1부터 10까지 출력</h4>
    <p id="result"></p>
    <script>
        // while(조건식) { 실행문 } => 조건이 만족할때 까지 실행
        let num = 0;
        while(num<5){
            console.log(`num : ${num}`);
            num++;
            console.log(`num 누적 결과 : ${num}`)
        }

        // DO ~ while 
        // DO{ 실행문 } while(조건식); => 무조건 한 번은 실행됨
        // 조건을 만족하지 않아도 무조건 한번 실행
        let count = 0;
        do{
            console.log(`무조건 한번은 출력~~`);
            count++;
            console.log(`count의 누적 : ${count}`);
        }while(count<3);

        console.log(`count의 끝 : ${count}`);

        // for문 : 조건이 만족할때까지 순회
        for(let i=0; i<10; i++){
            console.log(`반복 i : ${i}`);
        }
        // const키워드는 재할당자체가 안되기때문에 
        // 반복문에서는 사용할 수 없다.
        // 지금현재 i=0 ==> i++ 하고나면 => i=1 const 키워드는 불가
        // for(const i=0; i<10; i++){
        //     console.log(`반복 i : ${i}`);
        // }


        // 1부터 10까지 출력
        // p태그
        // for문 이용 

       let result = document.getElementById('result');
       let text = ''; // 현재 text변수는 문자열 데이터 타입이다.

       for(let i=1; i<=10; i++){
            text += "<strong>" +i + "</strong>";
            // text += i + " ";
            // console.log(`text 출력 : ${text}`)
            // console.log(`i 출력 : ${i}`);
       }
      // result.innerText = text; // 태그안에 텍스트형식으로 넣어준다.
       result.innerHTML = text; // Dom으로 지정한 변수의 태그안에 작성한 태그까지 넣어준다.

    </script>
</body>
</html>
