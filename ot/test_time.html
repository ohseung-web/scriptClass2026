<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="clock"></div>
    <script>
        let timer = setTimeout(() => {
            console.log('3초 후 한 번만 실행됩니다!');
        }, 3000);

        // 2초 후 타이머 취소
        setTimeout(() => {
            clearTimeout(timer);
            console.log('타이머가 취소되었습니다.');
        }, 2000);

        function setClock() {
        let now = new Date();
        let s = now.getHours() + ':' + now.getMinutes() + ':' + now.getSeconds();
            document.getElementById('clock').innerHTML = s;
            setTimeout('setClock()', 1000);
        }
        setClock();

    </script>
</body>
</html>
