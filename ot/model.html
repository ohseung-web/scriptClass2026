<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modal</title>
</head>
<body>
    <!-- 모달 열기 버튼 -->
    <button class="btn_open">뉴스레터 구독하기</button>
    <!-- 모달 전체 -->
     <div class="modal">
        <!-- 이미지와 문장 있는 곳 -->
         <div class="modal_content">
            <div class="photo"></div>
            <div class="desc">
                <div class="desc_header">
                    <h2>지금다양한 혜택을 받아보세요</h2>
                    <button class="btn_close">&times;</button>
                </div>
                
            </div>
         </div>
     </div>
</body>
</html>
