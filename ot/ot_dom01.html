<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        /* 기본 스타일 상태에서 적용할 변경 스타일 클래스 */
        .active-style {
            color: red;
            font-family: "Century Schoolbook", serif;
            font-style: italic;
        }
</style>
</head>
<body>
    <!-- 
        1) 문서 객체 모델(DOM, Document Object Model)은 
           XML이나 HTML 문서에 접근하기 위한 일종의 인터페이스이다.
        2) 웹 문서의 모든 요소를 자바스크립트를 이용하여 조작 할 수 있도록 
           객체를 사용해 문서를 해석하는 방법
        3) DOM 트리는 웹 문서의 HTML 요소만 표현하지 않는다. HTML요소가 품고 있는 텍스트, 
           이미지도 자식으로 간주한다.
    -->
    <h1>제목</h1>
    <p>본문</p>
    <h2 id="title">Hello</h2>
    <!-- 1) 요소노드(Element) : h2
         2) 속성노드 : id='title'
         3) 텍스트노드 : "Hello" 
    -->
    <p id="test01">test01</p>     
    <p class="test02">test02</p>     
    <p class="test02">test03</p>
    <p class="test04"><span class="spanTest04">test04</span></p>
    <h1 id="title02">안녕하세요</h1>

    <ul id="list">
        <li>기존 항목</li>
        <li id="item">삭제될 항목</li>
    </ul>

    <p id="p1">This is a paragraph.</p>
    <input type="button" onclick="changeStyle()" value="눌러보세요" />


    <script>
        //  요소노드 선택할때 사용 : getElementById('test01'), getElementsByClassName('test02')[0],
        //                          getElementsByTagName('p')[0]
        let elementNode01 = document.getElementById('test01');
        let elementNode02 = document.getElementsByClassName('test02');
        let elementNode03 = document.getElementsByTagName('p');
        console.log('요소노드01:',elementNode01);
        console.log('요소노드02:',elementNode02);
        console.log('요소노드03:',elementNode03);
        
        // querySelector()와 querySelectorAll()함수도 마찬가지로 요소 노드를 선택하지만, 
        // CSS 선택자 문법을 사용할 수 있어 더 유연하고 세밀하게 요소를 찾을 수 있다. 
        let elmen04 = document.querySelector('.test04 .spanTest04');
        // <span class="spanTest04">test04</span>
        console.log('querySelector :',elmen04);
        
        // DOM요소에 속성노드 접근하기
        //  => 요소의 텍스트나 속성에 접근하려면, 선택된 요소에서 
        // .textContent, .innerText, .getAttribute(), .setAttribute() 등의 프로퍼티/메서드를 사용해야 한다.
        // setAttribute('속성이름', '속성값')
        let elmen05 = document.querySelector('.test04');
        elmen05.setAttribute('id','#stest04');
        console.log('setAtrribute', elmen05);

       // id 속성 값 가져오기
        const idValue = elmen05.getAttribute('id');
        console.log('getAttribute:', idValue);

        document.getElementById("title02").textContent = "DOM 조작 성공!";
        

        //1. appendChild() 메서드
        // 부모 요소의 마지막 자식 요소로 새로운 노드를 추가하는 메서드입니다.
        // 사용 가능 대상: 자식 노드를 가질 수 있는 모든 부모 요소 (<div>, <ul>, <ol>, <p>, <body> 등)
        // document.createElement("li")
        // 브라우저 메모리에 <li>라는 새로운 HTML DOM 엘리먼트 객체를 새로 생성합니다.
            
        // 1. document.createElement("li")
        // 역할: 새로운 HTML 태그 객체를 메모리 상에 새로 생성합니다.
        // 특징: 이 코드가 실행되어도 화면에는 아무것도 나타나지 않습니다. 
        // 아직 브라우저의 화면 구조(DOM 트리)에 연결되지 않은 '공중에 떠 있는 부품' 상태이기 때문입니다.

        // 2. appendChild(li)
        // 역할: 만들어둔 태그 객체를 지정한 부모 요소의 맨 마지막 자식으로 붙여 넣습니다.
        // 특징: 이 코드가 실행되는 순간, 공중에 떠 있던 요소가 화면 
        // 구조에 실제로 연결되면서 사용자 눈에 비로소 보이게 됩니다.    
        let lia = document.createElement("li");
        lia.textContent = "새 항목";
        document.getElementById("list").appendChild(lia);

        // 2. remove() 메서드
        // 해당 요소를 DOM 트리의 부모 요소로부터 직접 삭제하는 메서드입니다.
        // 사용 가능 대상: DOM에 존재하는 모든 HTML 요소
        document.getElementById("item").remove();



        function changeStyle() {
            document.getElementById("p1").style.color = "red";
            document.getElementById("p1").style.fontFamily = "Century Schoolbook";
            document.getElementById("p1").style.fontStyle = "italic";
        }

        function changeStyle() {
            // active-style 클래스가 없으면 추가하고, 있으면 제거함
            document.getElementById("p1").classList.toggle("active-style");
        }
</script>

        
    </script>     
</body>
</html>
